version: 1
runtime:
  state_dir: ./.rainmusic/state
tools:
  yt_dlp:
    path: yt-dlp
  ffmpeg:
    path: ffmpeg
playback:
  default_volume: 30
  queue_limit: 500
bots:
  main:
    # Optional: application_id: "YOUR_APPLICATION_ID"
    token: "${RAINMUSIC_BOT_MAIN_TOKEN}"
    activity:
      enabled: true
servers:
  home:
    id: "YOUR_SERVER_ID"
    bots: [main]
    command_bot: main
