version: 1
runtime:
  state_dir: ./.asterinmusic/state
tools:
  yt_dlp:
    path: yt-dlp
  ffmpeg:
    path: ffmpeg
playback:
  disconnect_when_idle: false
  default_volume: 30
  queue_limit: 500
sources:
  youtube:
    metadata_language: ja
  niconico:
    auth:
      method: none
      # cookies: set method to cookies and specify only cookies_file.
      # cookies_file: "${NICONICO_COOKIES_FILE}"
      # password: set method to password and specify username/password only.
      # username: "${NICONICO_USERNAME}"
      # password: "${NICONICO_PASSWORD}"
bots:
  main:
    # Optional: application_id: "YOUR_APPLICATION_ID"
    token: "${ASTERINMUSIC_BOT_MAIN_TOKEN}"
    activity:
      enabled: true
servers:
  home:
    id: "YOUR_SERVER_ID"
    bots: [main]
    command_bot: main
