version: 1
logging:
  level: info
  format: text
  # components:
  #   voice: debug
runtime:
  state_dir: ./.asterinmusic/state
tools:
  yt_dlp:
    path: yt-dlp
  ffmpeg:
    path: ffmpeg
playback:
  disconnect_when_idle: false
  default_volume: 30
  queue_limit: 500
history:
  limit_per_voice: 10000
sources:
  youtube:
    metadata_language: ja
    data_api:
      enabled: false
      # api_key: "${YOUTUBE_DATA_API_KEY}"
  niconico:
    auth:
      method: none
      # cookies: set method to cookies and specify only cookies_file.
      # cookies_file: "${NICONICO_COOKIES_FILE}"
      # password: set method to password and specify username/password only.
      # username: "${NICONICO_USERNAME}"
      # password: "${NICONICO_PASSWORD}"
bots:
  main:
    # Optional: application_id: "YOUR_APPLICATION_ID"
    token: "${ASTERINMUSIC_BOT_MAIN_TOKEN}"
    activity:
      enabled: true
servers:
  home:
    id: "YOUR_SERVER_ID"
    bots: [main]
    command_bot: main
    authorization:
      preset: collaborative
      # Presets: collaborative, dj_control, dj_control_self_skip, dj_only.
      # All DJ presets require at least one role. The old name dj is not accepted.
      # dj_role_ids: ["YOUR_DJ_ROLE_ID"]
      # policies:
      #   - id: forbid_stop
      #     policy: 'forbid(principal, action == Action::"playback.stop", resource);'
