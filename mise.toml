[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64"]

[tools]
go = "1.27.2"
deno = "2"
ffmpeg = "8"
zig = "0.15.2"
python = "3.11.14"

[tools."github:discord/libdave"]
version = "1.1.0/cpp"
platforms.windows-x64 = { asset_pattern = "libdave-Windows-X64-boringssl.zip" }
platforms.linux-x64 = { asset_pattern = "libdave-Linux-X64-boringssl.zip" }

[tools."github:bazelbuild/bazel"]
version = "5.3.2"
platforms.linux-x64 = { asset_pattern = "bazel-5.3.2-linux-x86_64", format = "raw", rename_exe = "bazel" }
platforms.windows-x64 = { asset_pattern = "bazel-5.3.2-windows-x86_64.exe", format = "raw", rename_exe = "bazel.exe" }

[env]
GOMODCACHE = "{{ config_root }}/.dev/go-mod"
GOCACHE = "{{ config_root }}/.dev/go-cache"

[tools."github:yt-dlp/yt-dlp"]
version = "latest"
platforms.linux-x64 = { asset_pattern = "yt-dlp_linux", format = "raw", rename_exe = "yt-dlp" }
platforms.windows-x64 = { asset_pattern = "yt-dlp.exe", format = "raw" }

[tasks.test]
description = "Run offline unit and subprocess tests"
run = "go test ./..."

[tasks.check]
description = "Check formatting, vet, tests and cross-platform builds"
run = "go run ./cmd/dev check"

[tasks.fmt]
run = "go run ./cmd/dev fmt"

[tasks.deps-tidy]
description = "Reconcile pinned Go module dependencies"
run = "go mod tidy"

[tasks.build]
run = "go run ./cmd/dev build"

[tasks.doctor]
run = "go run ./cmd/asterinmusic doctor"

[tasks.inspect]
description = "Inspect a supported URL: mise run inspect -- URL"
run = "go run ./cmd/asterinmusic inspect"

[tasks.title-plugin-probe]
description = "Probe experimental localized YouTube title plugin without Discord"
run = "go run ./experiments/titleplugin"

[tasks.youtube-data-probe]
description = "Compare localized public video titles using .env.youtube API key"
run = "go run ./experiments/youtubedata"

[tasks.ui-preview]
description = "Send layout samples to the explicitly configured Discord test webhook"
run = "go run ./experiments/uipreview"

[tasks.capture]
description = "Bounded source acquisition: mise run capture -- URL OUTPUT"
run = "go run ./cmd/asterinmusic capture"

[tasks.render]
description = "Convert a local audio file at BGM volume: mise run render -- INPUT OUTPUT.ogg"
run = "go run ./cmd/asterinmusic render"

[tasks.audio-check]
description = "Verify local FFmpeg conversion without Discord or network"
run = "go run ./cmd/dev audio-check"

[tasks.native-audio-check]
description = "Verify paced native Opus audio and volume latency"
run = "go run ./cmd/dev native-audio-check"

[tasks.opus-compare]
description = "Compare pinned Pure Go Opus encoders against libopus offline"
run = "go run ./cmd/dev opus-compare"

[tasks.opus-pure-check]
description = "Run candidate encoders with CGO disabled"
run = "go run ./cmd/dev opus-pure-check"

[tasks.opus-simd-compare]
description = "Compare pinned gopus scalar/SIMD on amd64 v3 with Go 1.27"
run = "go run ./cmd/dev opus-simd-compare"

[tasks.quality-prepare]
description = "Prepare pinned public corpus and reference/Opus WAV pairs"
run = "go run ./cmd/quality prepare"

[tasks.quality-score]
description = "Score prepared corpus with official ViSQOL audio mode"
run = "go run ./cmd/quality score"

[tasks.quality-summary]
run = "go run ./cmd/quality summarize"

[tasks.config-check]
run = "go run ./cmd/asterinmusic config-check"

[tasks.source-check]
description = "Check one source with configured authentication, without Discord"
run = "go run ./cmd/asterinmusic source-check"

[tasks.discord-check]
run = "go run ./cmd/asterinmusic discord-check"

[tasks.register]
run = "go run ./cmd/asterinmusic register"

[tasks.serve]
run = "go run ./cmd/dev serve"

[tasks.bot-start]
run = "go run ./cmd/dev bot-start"

[tasks.bot-stop]
run = "go run ./cmd/dev bot-stop"

[tasks.bot-restart]
run = "go run ./cmd/dev bot-restart"

[tasks.bot-status]
run = "go run ./cmd/dev bot-status"

[tasks.bot-logs]
run = "go run ./cmd/dev bot-logs"

[tasks.dave-check]
run = "go run ./cmd/dev dave-check"

[tasks.dave-interop]
run = "go run ./cmd/dev dave-interop"

[tasks.bot-restart-go]
env = { ASTERINMUSIC_DAVE_BACKEND = "go" }
run = "go run ./cmd/dev bot-restart"

[tasks.bot-restart-native]
env = { ASTERINMUSIC_DAVE_BACKEND = "native" }
run = "go run ./cmd/dev bot-restart"

[tasks.build-voice-native]
env = { ASTERINMUSIC_DAVE_BACKEND = "native" }
run = "go run ./cmd/dev build-voice"

[tasks.voice-check]
run = "go run ./cmd/dev voice-check"

[tasks.build-voice]
run = "go run ./cmd/dev build-voice"

[tasks.update-check]
run = "go run ./cmd/asterinmusic update-check"

[tasks.update-apply]
run = "go run ./cmd/asterinmusic update-apply"

[tasks.update-rollback]
run = "go run ./cmd/asterinmusic update-rollback"

[tasks.race-test]
run = "go run ./cmd/dev race-test"

[tasks.stream-check]
run = "go run ./cmd/asterinmusic stream-check"

[tasks.inspect-mix]
run = "go run ./cmd/asterinmusic inspect-mix"
